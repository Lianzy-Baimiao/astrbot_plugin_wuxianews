<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #141519; }
body {
  width: 800px;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: #ECEDF2; -webkit-font-smoothing: antialiased;
}
.page { width: 800px; background: #141519; padding-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 32px; background: linear-gradient(135deg, #1F2A44, #3A4B6E); }
.brand-tag { font-size: 15px; font-weight: 800; color: #FFC14D; letter-spacing: 2px; }
.brand-name { font-size: 14px; color: rgba(255,255,255,.75); }
.content { padding: 26px 32px 0; }
.tag {
  display: inline-block; font-size: 13px; font-weight: 800; color: #FFC14D;
  background: rgba(255,193,77,.14); padding: 3px 10px; border-radius: 6px;
}
.title { margin-top: 12px; font-size: 28px; font-weight: 800; color: #fff; letter-spacing: 1px; line-height: 1.45; word-break: break-word; }
.meta { margin-top: 10px; font-size: 13px; color: #8D8F9C; }
.desc { margin-top: 18px; font-size: 16px; line-height: 1.9; color: #ECEDF2; white-space: pre-wrap; word-break: break-word; }
.divider { height: 1px; background: rgba(255,255,255,.08); margin: 20px 32px 0; }
.link { margin: 18px 32px 0; font-size: 13px; color: #8CB2F0; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 12px 16px; word-break: break-all; line-height: 1.6; }
.foot { padding: 16px 32px 0; font-size: 12px; color: #727482; text-align: right; }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <span class="brand-tag">天涯明月刀 · 官方公告</span>
    <span class="brand-name">wuxia.qq.com</span>
  </div>
  <div class="content">
    <span class="tag">{{ tag }}</span>
    <div class="title">{{ title }}</div>
    <div class="meta">公告日期：{{ time }}</div>
    {% if desc %}<div class="desc">{{ desc }}</div>{% endif %}
  </div>
  <div class="divider"></div>
  <div class="link">原文链接：{{ url }}</div>
  <div class="foot">来源：wuxia.qq.com · 天刀官方公告</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>天刀公告</title>
<!--
  显式声明桥接 SDK：AstrBot 会把这个 src 重写成带 asset_token 的真实地址。
  整个页面里除这一处外不要再出现那个脚本地址（连注释都不行），否则自动注入会失效。
-->
<script src="/api/plugin/page/bridge-sdk.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>天刀公告</h1>
    <span class="pill" id="runPill">加载中…</span>
    <span class="spacer"></span>
    <button id="btnPickGroup">选择群…</button>
    <button id="btnReload">刷新</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>推送群</h2>
    <p class="hint">
      勾选要自动推送天刀公告的群（每 5 分钟检查，有更新才推），保存后立即生效，
      与在群里发「天刀新闻推送 开」等价。
    </p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:56px">推送</th><th>群</th><th>群号</th>
          <th>上次推送的公告</th><th class="acts">操作</th>
        </tr></thead>
        <tbody id="groupBody"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnSaveGroups" class="primary">保存推送群</button>
      <button id="btnPushAll">立刻检查并推送（全部群）</button>
      <span class="hint" id="saveHint"></span>
    </div>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>推送记录</h2>
      <p class="hint">记录每个群上次推过的公告标题，用来去重。重置后下次检查会重推最新公告。</p>
      <div class="list" id="recordList"></div>
      <div class="row" style="margin-top:10px">
        <button id="btnResetAll" class="danger">清空全部记录</button>
        <span class="spacer"></span>
        <span class="hint" id="recordHint"></span>
      </div>
    </div>
    <div class="card">
      <h2>公告图参数</h2>
      <div class="field">
        <label for="cfgShotEnabled">公告图使用手机网页整页截图</label>
        <select id="cfgShotEnabled">
          <option value="1">开启（与手机看官网一致）</option>
          <option value="0">关闭（用深色卡片图）</option>
        </select>
      </div>
      <div class="field">
        <label for="cfgShotHeight">截图最大高度（CSS 像素，0 = 不截断）</label>
        <input type="text" id="cfgShotHeight" placeholder="5000">
      </div>
      <div class="field">
        <label for="cfgShotQuality">截图 JPEG 质量（1-100）</label>
        <input type="text" id="cfgShotQuality" placeholder="88">
      </div>
      <div class="row">
        <button id="btnSaveConfig" class="primary">保存参数</button>
        <span class="hint" id="cfgHint"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>截图缓存</h2>
    <div class="row">
      <span class="hint" id="shotHint"></span>
      <span class="spacer"></span>
      <button id="btnClearCache">清空摘要缓存</button>
      <button id="btnClearShots" class="danger">清空截图</button>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>
</div>

<div class="modal-mask" id="pickMask" hidden>
  <div class="modal">
    <h2>选择推送群</h2>
    <div class="row">
      <div class="field grow">
        <label for="pickSearch">搜索群名 / 群号</label>
        <input type="text" id="pickSearch" placeholder="例：天刀 或 339466990">
      </div>
      <button id="btnPickRefresh">刷新群列表</button>
    </div>
    <div class="pick-list" id="pickList"></div>
    <div class="modal-foot">
      <span class="hint" id="pickHint" style="margin-right:auto"></span>
      <button id="btnPickApply" class="primary">用勾选结果替换名单</button>
      <button id="pickClose">取消</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="testMask" hidden>
  <div class="modal">
    <h2>测试推送</h2>
    <p class="hint" id="testTarget"></p>
    <div class="row">
      <label><input type="checkbox" id="testForce"> 强制重发（忽略「已推送过」的记录）</label>
    </div>
    <div class="modal-foot">
      <span class="hint" id="testResult" style="margin-right:auto"></span>
      <button id="btnTestRun" class="primary">开始推送</button>
      <button id="testClose">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <p id="modalMsg" style="white-space:pre-line;color:var(--muted,#9aa)"></p>
    <input id="modalInput" type="text" hidden
      style="width:100%;box-sizing:border-box;padding:6px 8px;margin-top:6px">
    <div class="modal-foot">
      <button class="primary" id="modalOk">确定</button>
      <button id="modalCancel">取消</button>
    </div>
  </div>
</div>
<!-- Keep the image URL in HTML so AstrBot can rewrite it with an asset token. -->
<template id="heroArtTemplate">
  <img class="art-client-icon" src="./wuxia-client-icon.png" width="128" height="128" alt="">
</template>
<script src="./shell.js"></script>
<script src="./app.js"></script>
</body>
</html>
